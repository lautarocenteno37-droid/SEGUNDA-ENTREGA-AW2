<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>LOGIN</title>
</head>
<body class="bg-gray-950  text-gray-300" >
    <div class="flex justify-center items-center">
        <div class="bg-gray-800 rounded-3xl mt-20 p-10 w-96">
            <h1 class ="text-2xl">Login</h1>
            <form class="flex flex-col mt-5">
                <input type="text" placeholder="Nombre" id="txtName" class="mb-4 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" >
                <input type="password" placeholder="Contraseña" id="txtPass" class="mb-4 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" >
                <button type="button" id="btnLogin" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg" >
                    Iniciar sesion
                </button>
        </div>
    </div>
    <script type="module" src="./auth/auth.js"></script>
</body>
</html>
