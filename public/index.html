<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>LOGIN</title>
</head>
<body class="bg-gray-950 text-gray-300 min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 rounded-3xl p-10 w-96 shadow-2xl border border-gray-700">
        <h1 class="text-2xl font-bold text-center text-white mb-6">Iniciar Sesión</h1>
        
        <form id="formLogin" class="flex flex-col">
            
            <label class="text-xs font-semibold text-gray-400 mb-1 ml-1 uppercase tracking-wider">Email o Usuario</label>
            <input type="text" placeholder="ejemplo@correo.com" id="txtName" required
                   class="mb-4 p-2.5 rounded-lg bg-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all">
            
            <label class="text-xs font-semibold text-gray-400 mb-1 ml-1 uppercase tracking-wider">Contraseña</label>
            <input type="password" placeholder="••••••••" id="txtPass" required
                   class="mb-5 p-2.5 rounded-lg bg-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all">
            
            <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg cursor-pointer transition-colors">
                Iniciar sesión
            </button>
            
            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-gray-700"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-xs uppercase font-bold tracking-widest">ó</span>
                <div class="flex-grow border-t border-gray-700"></div>
            </div>

            <button type="button" id="btnRegister" onclick="window.location.href='./pages/home/register.html'" 
                    class="bg-transparent border border-gray-600 hover:border-gray-400 hover:text-white text-gray-400 font-medium py-2 px-4 rounded-lg cursor-pointer transition-all">
                Crear una cuenta
            </button>
        </form>
    </div>

    <script type="module" src="./auth/auth.js"></script>
</body>
</html>
