<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Catálogo - Tienda</title>
</head>

<body class="bg-gray-950 text-gray-300">
    <div class="max-w-4xl mx-auto mt-10 p-6 bg-gray-900/30 border border-gray-900 rounded-2xl shadow-xl">
        <h2 class="text-rose-500 font-bold text-center uppercase tracking-widest text-2xl mb-6">
            Menú y Filtros
        </h2>

        <div class="flex flex-wrap justify-center gap-3 mb-8">
            <button onclick="window.loadProducts('all')"
                class="px-5 py-2 bg-gray-900 border border-gray-500 text-sm font-semibold rounded-xl text-white hover:bg-rose-600 transition-all">
                Todos
            </button>

            <button onclick="window.loadProducts('zapatilla')"
                class="px-5 py-2 bg-gray-900 border border-gray-500 text-sm font-semibold rounded-xl text-white hover:bg-rose-600 transition-all">
                Zapatillas
            </button>

            <button onclick="window.loadProducts('gorra')"
                class="px-5 py-2 bg-gray-900 border border-gray-500 text-sm font-semibold rounded-xl text-white hover:bg-rose-600 transition-all">
                Gorras
            </button>

            <button onclick="window.loadProducts('pantalon')"
                class="px-5 py-2 bg-gray-900 border border-gray-500 text-sm font-semibold rounded-xl text-white hover:bg-rose-600 transition-all">
                Pantalones
            </button>
        </div>

        <div class="flex flex-wrap justify-center gap-3 pt-6 border-t border-gray-800">
            <button onclick="window.location.href = './carrito.html'"
                class="px-5 py-2 border border-green-950-200 text-green-400 hover:bg-rose-950 rounded-xl text-sm font-semibold transition-all">
                🛒 Carrito
            </button>

            <button onclick="window.location.href = './ordenes.html'"
                class="px-5 py-2 border border-blue-950-200 text-blue-400 hover:bg-blue-950 rounded-xl text-sm font-semibold transition-all">
                📦 Mis Órdenes
            </button>

            <button id="btnCerrarSesion"
                class="px-5 py-2 border border-red-950-200 text-red-400 hover:bg-red-950 rounded-xl text-sm font-semibold transition-all">
                ❌ Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="productContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto"></div>

    <script type="module" src="./productos.js"></script>
</body>

</html>
