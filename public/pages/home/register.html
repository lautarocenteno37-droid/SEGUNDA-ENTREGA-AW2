<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>REGISTRO</title>
</head>
<body class="bg-gray-950 text-gray-300">
    <div class="flex justify-center items-center min-h-screen py-10">
        <div class="bg-gray-800 rounded-3xl p-10 w-100 border-2 border-gray-900 shadow-xl">
            <h1 class="text-2xl font-bold text-gray-100 uppercase tracking-wide">Crear Cuenta</h1>
            <p class="text-xs text-rose-500 font-semibold mt-1 uppercase tracking-widest">Completa todos tus datos</p>

            <form class="flex flex-col mt-6" id="formRegister">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block" for="regName">Nombre</label>
                        <input type="text" placeholder="Lautaro" id="regName" required
                            class="mb-4 p-2 w-full rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block" for="regLastName">Apellido</label>
                        <input type="text" placeholder="Centeno" id="regLastName" required
                            class="mb-4 p-2 w-full rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">
                    </div>
                </div>

                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1" for="regEmail">Correo Electrónico</label>
                <input type="email" placeholder="ejemplo@gmail.com" id="regEmail" required
                    class="mb-4 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">

                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1" for="regPhone">Teléfono / Celular</label>
                <input type="tel" placeholder="3584123456" id="regPhone" required
                    class="mb-4 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">

                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1" for="regAddress">Dirección de Envío</label>
                <input type="text" placeholder="Belgrano 31" id="regAddress" required
                    class="mb-4 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">

                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1" for="regPass">Contraseña</label>
                <input type="password" placeholder="••••••••" id="regPass" required
                    class="mb-6 p-2 rounded-lg bg-gray-700 text-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 border border-transparent">
                
                <button type="submit" id="btnSubmitRegister" 
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors cursor-pointer uppercase text-sm tracking-wider">
                    Registrarme
                </button>
                
                <button type="button" onclick="window.location.href='../../index.html'" 
                    class="text-xs text-gray-400 hover:text-gray-200 mt-4 underline cursor-pointer transition-colors text-center">
                    ¿Ya tienes cuenta? Inicia sesión
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="./register.js"></script>
</body>
</html>
